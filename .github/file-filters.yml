# This file is used by the dorny/paths-filter action to figure out if a program or
# client has changed and thus if it should be built or tested. Any changes in the
# files listed below will trigger the appropriate workflow for that program or client.

# Programs.

program_common: &program_common
  - ".github/workflows/main.yml"
  - ".github/file-filters.yml"
  - ".github/programs.json"
  - ".github/.env"
  - "Cargo.toml"
  - "Cargo.lock"
  - "configs/scripts/program/**"

bgl_cartridge_program: &bgl_cartridge_program
  - *program_common
  - "programs/bgl-cartridge/**"

bgl_ghost_program: &bgl_ghost_program
  - *program_common
  - "programs/bgl-ghost/**"

bgl_legit_program: &bgl_legit_program
  - *program_common
  - "programs/bgl-legit/**"

programs: &programs
  - *bgl_cartridge_program
  - *bgl_ghost_program
  - *bgl_legit_program

# Clients.

client_common: &client_common
  - *programs
  - ".github/workflows/main.yml"
  - ".github/file-filters.yml"
  - ".github/programs.json"
  - ".github/.env"
  - "configs/scripts/client/**"
  - "configs/shank.cjs"
  - "configs/cartridge-kinobi.cjs"
  - "configs/ghost-kinobi.cjs"
  - "configs/legit-kinobi.cjs"
  - "configs/validator.cjs"

js_client: &js_client
  - *client_common
  - "clients/js-cartridge/**"
  - "clients/js-ghost/**"

rust_client: &rust_client
  - *client_common
  - "clients/rust-cartridge/**"
  - "clients/rust-ghost/**"

clients: &clients
  - *js_client
  - *rust_client

# Any.

any: &any
  - *programs
  - *clients
