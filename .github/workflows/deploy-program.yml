name: Deploy Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag (release/bgl-cartridge@0.1.0) or commit to deploy
        required: true
        type: string
        default: release/bgl-cartridge@0.1.0
      program:
        description: Program
        required: true
        default: bgl-cartridge
        type: choice
        options:
          - bgl-cartridge
          - bgl-ghost
          - bgl-legit
      cluster:
        description: Cluster environment
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet-beta
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: false

env:
  CACHE: true

jobs:
  check_tag:
    name: 'Check tag'
    runs-on: ubuntu-latest
    outputs:
      program: ${{ steps.set_program.outputs.program }}
      type: ${{ steps.set_program.outputs.type }}
    steps:
    - name: Check tag
      id: set_program
      run: |
        echo program="${{ inputs.program }}" >> $GITHUB_OUTPUT
        if [[ "${{ inputs.git_ref }}" =~ ^release/${{ inputs.program }}@* ]]; then
          echo type="release" >> $GITHUB_OUTPUT
        else
          echo type="ref" >> $GITHUB_OUTPUT
        fi
  build_programs:
    name: Programs
    uses: ./.github/workflows/build-programs.yml
    secrets: inherit
    needs: check_tag
    if: needs.check_tag.outputs.type == 'ref'
    with:
      git_ref: ${{ inputs.git_ref }}

  test_programs:
    name: Test Programs
    uses: ./.github/workflows/test-programs.yml
    secrets: inherit
    needs: [build_programs, check_tag]
    if: needs.check_tag.outputs.type == 'ref'
    with:
      program_matrix: '["${{ inputs.program }}"]'
      git_ref: ${{ inputs.git_ref }}

  test_js:
    name: JS client
    needs: [build_programs, check_tag]
    uses: ./.github/workflows/test-js-client.yml
    secrets: inherit
    if: needs.check_tag.outputs.type == 'ref'
    with:
      git_ref: ${{ inputs.git_ref }}

  test_rust:
    name: Rust client
    needs: [build_programs, check_tag]
    uses: ./.github/workflows/test-rust-client.yml
    secrets: inherit
    if: needs.check_tag.outputs.type == 'ref'
    with:
      git_ref: ${{ inputs.git_ref }}

  deploy_program:
    name: Program / Deploy
    runs-on: ubuntu-latest-16-cores
    needs: [check_tag, test_js, test_programs, test_rust]
    if: |
      always()
      && (needs.test_js.result == 'success' || needs.test_js.result == 'skipped')
      && (needs.test_programs.result == 'success' || needs.test_programs.result == 'skipped')
      && (needs.test_rust.result == 'success' || needs.test_rust.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        run: |
          # Allowlist instead of a blanket `cat .github/.env >> "$GITHUB_ENV"` so a
          # PR-editable key in `.github/.env` cannot inject arbitrary env vars into
          # subsequent steps.
          grep -E '^(CARGO_TERM_COLOR|RUST_VERSION|SOLANA_VERSION|SOLANA_VERIFY_VERSION|SOLANA_VERIFY_BUILD_VERSION|COMMIT_USER_NAME|COMMIT_USER_EMAIL|DEPLOY_SOLANA_VERSION)=' .github/.env >> "$GITHUB_ENV"

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ env.DEPLOY_SOLANA_VERSION }}
          cache: ${{ env.CACHE }}

      - name: Install solana-verify
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta'
        uses: metaplex-foundation/actions/install-solana-verify@v1
        with:
          version: ${{ env.SOLANA_VERIFY_VERSION }}

      - name: Set RPC
        run: |
          # We do this if waterfall because github actions does not allow dynamic access to secrets
          if [ "${{ inputs.cluster }}" == "devnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.DEVNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "mainnet-beta" ]; then
            printf 'RPC=%s\n' "${{ secrets.MAINNET_RPC }}" >> "$GITHUB_ENV"
          else
            echo "Invalid cluster: ${{ inputs.cluster }}"
            exit 1
          fi

      - name: Identify Program
        run: |
          PROGRAM="${{ inputs.program }}"
          printf 'PROGRAM_NAME=%s\n' "${PROGRAM//-/_}_program" >> "$GITHUB_ENV"
          printf 'PROGRAM_PACKAGE=%s\n' "${PROGRAM}-program" >> "$GITHUB_ENV"
          # Upgrades only need the program's address, which declare_id! already
          # holds, so no program-id keypair is kept in CI. A first deploy needs
          # that keypair and is done by hand.
          PROGRAM_ID=$(grep -oE 'declare_id!\("[1-9A-HJ-NP-Za-km-z]+"\)' "programs/${PROGRAM}/src/lib.rs" | cut -d'"' -f2)
          if [ -z "$PROGRAM_ID" ]; then
            echo "No declare_id! in programs/${PROGRAM}/src/lib.rs"
            exit 1
          fi
          printf 'PROGRAM_ID=%s\n' "$PROGRAM_ID" >> "$GITHUB_ENV"

      - name: Sanitize Ref
        id: sanitize
        shell: bash
        run: |
          REF="${{ inputs.git_ref }}"
          if [ -z "$REF" ]; then
            REF="default"
          fi
          SANITIZED=${REF//\//-}
          echo "sanitized=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Download program builds
        uses: actions/download-artifact@v4
        if: needs.check_tag.outputs.type == 'ref'
        with:
          name: program-builds-${{ steps.sanitize.outputs.sanitized }}

      - name: Download release asset
        uses: actions/github-script@v5
        id: get_release
        if: needs.check_tag.outputs.type == 'release'
        with:
          script: |
            const tag = "${{ inputs.git_ref }}";
            const assetName = "${{ env.PROGRAM_NAME }}.so";

            // Fetch the release associated with the tag
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });

            if (release.status !== 200) {
              throw new Error(`Failed to fetch release for tag ${tag}`);
            }

            const asset = release.data.assets.find(asset => asset.name === assetName);
            if (!asset) {
              throw new Error(`Asset ${assetName} not found in release tagged ${tag}`);
            }

            core.setOutput("url", asset.url);

      - name: Download the Selected Asset
        if: needs.check_tag.outputs.type == 'release'
        run: |
          mkdir -p ${{ github.workspace }}/programs/.bin
          curl -L -o ${{ github.workspace }}/programs/.bin/${{ env.PROGRAM_NAME }}.so \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ steps.get_release.outputs.url }}"

      - name: Write signer files
        if: github.event.inputs.dry_run == 'false'
        env:
          PROGRAM_SOLANA_DEPLOY_KEY: ${{ secrets.PROGRAM_SOLANA_DEPLOY_KEY }}
        run: printf '%s' "$PROGRAM_SOLANA_DEPLOY_KEY" > ./deployer-key.json

      - name: Deploy Program
        if: github.event.inputs.dry_run == 'false'
        run: |
          echo "Deploying ${{ inputs.program }} (${PROGRAM_ID}) to ${{ inputs.cluster }}"

          solana -v program deploy "./programs/.bin/${PROGRAM_NAME}.so" \
            -u "${RPC}" \
            --program-id "${PROGRAM_ID}" \
            -k ./deployer-key.json \
            --max-sign-attempts 100 \
            --use-rpc

      # Direct deploys sign the verified-build PDA with the deploy key itself
      # (verify-from-repo mode), then hand the job to OtterSec. The binary just
      # deployed came from verified-build in build-programs.yml, so the rebuilt
      # hash matches. OtterSec has no devnet verifier, so mainnet only.
      - name: Verify program
        if: github.event.inputs.dry_run == 'false' && inputs.cluster == 'mainnet-beta'
        uses: metaplex-foundation/actions/verify-program@v1
        with:
          program-id: ${{ env.PROGRAM_ID }}
          keypair: ./deployer-key.json
          rpc-url: ${{ env.RPC }}
          library-name: ${{ env.PROGRAM_NAME }}
          package: ${{ env.PROGRAM_PACKAGE }}
          solana-version: ${{ env.SOLANA_VERIFY_BUILD_VERSION }}
          repo-visibility: public

      - name: Create env tag
        uses: actions/github-script@v7
        if: github.event.inputs.dry_run == 'false'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const refData = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ (needs.check_tag.outputs.type == 'release' && format('tags/{0}', inputs.git_ref)) || inputs.git_ref }}'
            });
            if (refData.status !== 200) {
              throw new Error('Failed to fetch existing tag');
            }
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ needs.check_tag.outputs.program }}-${{ inputs.cluster }}',
              sha: refData.data.object.sha
            }).catch(async (err) => {
              if (err.status !== 422) throw err;
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ needs.check_tag.outputs.program }}-${{ inputs.cluster }}',
                sha: refData.data.object.sha,
                force: true
              });
            })

      - name: Clean up signer files
        if: always()
        run: rm -f ./deployer-key.json
