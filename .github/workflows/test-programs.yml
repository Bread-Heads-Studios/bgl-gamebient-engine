name: Test Programs

on:
  workflow_call:
    inputs:
      program_matrix:
        type: string
      git_ref:
        type: string

env:
  CACHE: true

jobs:
  test_programs:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        program: ${{ fromJson(inputs.program_matrix) }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        run: |
          # Allowlist instead of a blanket `cat .github/.env >> "$GITHUB_ENV"` so a
          # PR-editable key in `.github/.env` cannot inject arbitrary env vars into
          # subsequent steps.
          grep -E '^(CARGO_TERM_COLOR|NODE_VERSION|PROGRAMS|RUST_VERSION|SOLANA_VERSION|DEPLOY_SOLANA_VERSION|SOLANA_VERIFY_VERSION|SOLANA_VERIFY_BUILD_VERSION|COMMIT_USER_NAME|COMMIT_USER_EMAIL)=' .github/.env >> "$GITHUB_ENV"

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ env.SOLANA_VERSION }}
          cache: ${{ env.CACHE }}

      - name: Install Protobuf Compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache program dependencies
        if: env.CACHE == 'true'
        uses: metaplex-foundation/actions/cache-program@v1
        with:
          folder: ./programs/${{ matrix.program }}
          key: program-${{ matrix.program }}

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --manifest-path ./programs/${{ matrix.program }}/Cargo.toml -- --check

      - name: Run cargo clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --all-targets --all-features --no-deps --manifest-path ./programs/${{ matrix.program }}/Cargo.toml

      - name: Run tests
        shell: bash
        working-directory: configs/scripts/program
        run: RUST_LOG=error ./test.sh
        env:
          PROGRAM: ${{ matrix.program }}
